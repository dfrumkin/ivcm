[project]
name = "ivcm"
version = "1.0.2"
description = "Medical image classification and segmentation."
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torchvision",
    "lightning",
    "hydra-core",
    "timm",
    "segmentation-models-pytorch",
    "monai",
    "albumentations",
    "torchmetrics",
    "wandb",
    "rich",
    "nibabel",
    "pillow",
    "scikit-image",
    "scipy",
]

[project.optional-dependencies]
# Desktop clinical-review UI. Kept optional so headless training/inference runtimes (and CI that
# only runs the pipeline) need not install Qt. Dev/type-checking does need it: `uv sync --extra ui`.
ui = [
    "pyside6",
]

[project.scripts]
train = "ivcm.train:main"
cross-validate = "ivcm.cv:main"
predict-cv = "ivcm.predict:main"
ivcm-ui = "ivcm.app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff",
    "pre-commit",
    "pytest",
]
# Windows packaging: PyInstaller freezes the UI into a distributable one-folder bundle. Kept in its
# own group so training/inference runtimes and CI that only run the pipeline need not install it;
# the Windows build workflow syncs it with `--group packaging`.
packaging = [
    "pyinstaller",
]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", "scripts"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 120
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
