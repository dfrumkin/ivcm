# @package _global_
# Composes the classification setup. Selecting `task=classification` swaps in all of
# the data / model / loss / optimizer / scheduler groups below.
defaults:
  - /data: classification
  - /model: classification
  - /loss: cross_entropy
  - /optimizer: adamw
  - /scheduler: cosine

# Single source of truth for the classes; the class count is derived as
# ${len:${class_names}}. Order fixes the per-class metric indices.
class_names: [endothelium, epithelium, nerves, stroma]
