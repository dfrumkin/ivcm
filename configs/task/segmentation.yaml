# @package _global_
# Composes the segmentation setup. Selecting `task=segmentation` swaps in all of
# the data / model / loss / optimizer / scheduler groups below.
defaults:
  - /data: segmentation
  - /model: segmentation
  - /loss: dice_ce
  - /optimizer: adamw
  - /scheduler: cosine

# Binary segmentation: background vs. nerve. Class count is ${len:${class_names}} = 2.
class_names: [background, nerve]

# Metric the best-checkpoint callback (`callbacks=default`) monitors for this task. AUPRC, not
# AUROC or Dice: under heavy foreground/background imbalance AUROC is dominated by easy
# background true negatives, while Dice@0.5 bakes in a fixed operating point. AUPRC (average
# precision) is threshold-free *and* imbalance-aware (ignores background true negatives), so it
# is the right selector while the deployment threshold is undecided. Switch to val/dice once the
# operating threshold is fixed.
checkpoint_monitor: val/auprc
checkpoint_mode: max

# Task-specific photometric tuning (overrides the global `augmentation.photometric` from common.yaml,
# which composes before this task). Nerve segmentation keys on local nerve/stroma contrast, so the
# contrast/gamma warps hurt it (removing them recovered the pre-augmentation baseline) while they
# help classification. Keep only mild brightness jitter here; D4 geometric augmentation still applies,
# and classification keeps the stronger global default. Re-enable with CLI overrides for ablations.
augmentation:
  photometric:
    brightness_limit: 0.1
    contrast_limit: 0.0
    gamma_limit: [100, 100]  # gamma == 1.0 -> identity (no gamma warp)
