# Root config. The `task` group is the single switch between classification and
# segmentation: it composes the matching data / model / loss / optimizer / scheduler.
# `task: ???` is mandatory (no default) so `uv run train` errors clearly until a task is
# chosen, rather than silently picking one. Shared root settings come from `common`.
defaults:
  - common
  - task: ???
  - _self_
