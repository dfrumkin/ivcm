# Root config. The `task` group is the single switch between classification and
# segmentation: it composes the matching data / model / loss / optimizer / scheduler.
defaults:
  - task: classification
  - trainer: default
  - logger: wandb
  - _self_

# Number of classes, tied across data + model via ${num_classes} interpolation.
# For segmentation this includes the background class.
num_classes: 5
seed: 42
