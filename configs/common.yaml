# @package _global_
# Shared root settings included by both train.yaml and cv.yaml (avoids duplication and
# guarantees `seed` exists, which run() reads unconditionally).
defaults:
  - trainer: default
  - logger: wandb
  - callbacks: none

seed: 42
# Single input resolution for the whole pipeline; datasets/transforms read ${image_size}.
image_size: 384
# Checkpoint to resume training from (Lightning restores epoch/optimizer/scheduler state).
# null -> fresh run. Override with a path, e.g. ckpt_path=outputs/.../checkpoints/last.ckpt.
ckpt_path: null
# Plain relative default (no Hydra interpolation) so OmegaConf.resolve works under the
# bare compose() API used by tests. Override with IVCM_DATA_DIR for an absolute path.
data_dir: ${oc.env:IVCM_DATA_DIR,data}

hydra:
  job:
    # Keep the relative data_dir stable (already the default for version_base=None).
    chdir: false
