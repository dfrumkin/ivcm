# @package _global_
# Shared root settings included by both train.yaml and cv.yaml (avoids duplication and
# guarantees `seed` exists, which run() reads unconditionally).
defaults:
  - trainer: default
  - logger: wandb
  - callbacks: none

seed: 42
# Classification input resolution (images are resized to this) and the synthetic-image canvas
# size; classification datasets/transforms read ${image_size}. Segmentation no longer resizes
# — it trains on ${crop_size} crops and infers with sliding windows (see crop_size below).
image_size: 384
# Segmentation crop / sliding-window size. Training crops ${crop_size} out of the native-
# resolution slice; validation/prediction slide a ${crop_size} window over the full image.
# It becomes a direct U-Net input, so it must be divisible by the encoder's downsampling
# stride (32 for the resnet encoders); the default 192 = 6*32 satisfies this.
crop_size: 192
# Checkpoint to resume training from (Lightning restores epoch/optimizer/scheduler state).
# null -> fresh run. Override with a path, e.g. ckpt_path=outputs/.../checkpoints/last.ckpt.
ckpt_path: null
# Plain relative default (no Hydra interpolation) so OmegaConf.resolve works under the
# bare compose() API used by tests. Override with IVCM_DATA_DIR for an absolute path.
data_dir: ${oc.env:IVCM_DATA_DIR,data}

hydra:
  job:
    # Keep the relative data_dir stable (already the default for version_base=None).
    chdir: false
