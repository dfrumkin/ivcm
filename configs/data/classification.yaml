# Synthetic classification data (default, data-free). BaseDataModule holds two datasets;
# the dataset generates at ${image_size} so smoke runs stay small.
_target_: ivcm.data.BaseDataModule
batch_size: 8
num_workers: 0
class_names: ${class_names}
# Inverse-frequency class weighting is derived from the train dataset's per-class counts and applied
# automatically when the dataset exposes them; the synthetic dataset does not, so this is a no-op here.
# Present so `data.weighted_loss=false` composes under Hydra struct mode.
weighted_loss: true
train_dataset:
  _target_: ivcm.data.SyntheticClassificationDataset
  num_samples: 64
  num_classes: ${len:${class_names}}
  image_size: ${image_size}
  seed: 0
  transform:
    _target_: ivcm.data.transforms.build_d4_transform
    size: ${image_size}
val_dataset:
  _target_: ivcm.data.SyntheticClassificationDataset
  num_samples: 32
  num_classes: ${len:${class_names}}
  image_size: ${image_size}
  seed: 10000
  transform:
    _target_: ivcm.data.transforms.build_eval_transform
    size: ${image_size}
