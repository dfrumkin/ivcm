# Real segmentation data, mode (b): patient-grouped 5-fold CV over data/segmentation2 only
# (two-annotator soft masks). `fold` selects the validation patient block (cross-validate sweeps
# 0..n-1). Validation batches one instance at a time (native-resolution, sliding-window inference).
_target_: ivcm.data.Segmentation2CVDataModule
root: ${data_dir}/segmentation2
n_folds: 5
fold: 0
batch_size: 4
num_workers: 0
crop_size: ${crop_size}
photometric: ${augmentation.photometric}
